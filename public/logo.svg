<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <defs>
    <!-- Circular Path for Upper Text -->
    <path id="upperArc" d="M 65,240 A 185,185 0 1,1 435,240" fill="none" />
    <!-- Circular Path for Lower Text -->
    <path id="lowerArc" d="M 430,260 A 185,185 0 0,1 70,260" fill="none" />
    <!-- Clip Path for central silhouette area -->
    <clipPath id="circleClip">
      <circle cx="250" cy="240" r="150" />
    </clipPath>
  </defs>

  <!-- Outer Double Circle Border -->
  <circle cx="250" cy="240" r="215" fill="#ffffff" stroke="#0f388a" stroke-width="9" />
  <circle cx="250" cy="240" r="162" fill="none" stroke="#0f388a" stroke-width="3.5" />

  <!-- Upper Curved Text -->
  <text fill="#0f388a" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="16.5" font-weight="900" letter-spacing="1.2">
    <textPath href="#upperArc" startOffset="50%" text-anchor="middle">
      FOUNDATION FOR THE SUPPORT &amp; EMPOWERMENT OF WIDOWS &amp; WIDOWERS INITIATIVE
    </textPath>
  </text>

  <!-- Left and Right Dots -->
  <circle cx="56" cy="246" r="7" fill="#0f388a" />
  <circle cx="444" cy="246" r="7" fill="#0f388a" />

  <!-- Lower Curved Text -->
  <text fill="#0f388a" font-family="'Plus Jakarta Sans', serif" font-size="18.5" font-weight="700" font-style="italic" letter-spacing="0.5">
    <textPath href="#lowerArc" startOffset="50%" text-anchor="middle">
      Empowering Lives, Restoring Hope, Building Futures
    </textPath>
  </text>

  <!-- Inside Circle Graphics -->
  <g clip-path="url(#circleClip)">
    
    <!-- Woman Silhouette (Purple, facing left) -->
    <path d="M 230,120 C 205,120 188,135 180,155 C 172,175 174,195 168,210 C 160,230 145,245 140,270 C 155,275 180,275 205,270 C 220,250 232,220 235,190 C 238,160 238,130 230,120 Z" fill="#6f1d7d" />
    <!-- Woman hair flow -->
    <path d="M 215,125 C 190,130 170,150 165,175 C 160,200 172,215 175,235 C 178,255 165,270 150,285 C 170,290 195,285 210,275 C 225,250 228,210 226,170 C 225,145 220,130 215,125 Z" fill="#581663" />

    <!-- Man Silhouette (Royal Blue, facing right) -->
    <path d="M 270,120 C 295,120 312,135 320,155 C 328,175 326,195 332,210 C 340,230 355,245 360,270 C 345,275 320,275 295,270 C 280,250 268,220 265,190 C 262,160 262,130 270,120 Z" fill="#0f388a" />
    <!-- Man collar and hair profile -->
    <path d="M 285,125 C 310,130 330,150 335,175 C 340,200 328,215 325,235 C 322,255 335,270 350,285 C 330,290 305,285 290,275 C 275,250 272,210 274,170 C 275,145 280,130 285,125 Z" fill="#0b2c6d" />

  </g>

  <!-- Big Central Protective Hands (Deep Royal Blue) -->
  <path d="M 95,210 C 105,245 125,285 160,320 C 190,345 225,365 250,370 C 235,355 210,335 185,310 C 160,285 130,250 115,220 Z" fill="#0c327d" />
  <path d="M 120,230 C 135,270 165,315 215,350 C 190,330 165,295 145,260 Z" fill="#0f388a" />
  
  <path d="M 405,210 C 395,245 375,285 340,320 C 310,345 275,365 250,370 C 265,355 290,335 315,310 C 340,285 370,250 385,220 Z" fill="#0c327d" />
  <path d="M 380,230 C 365,270 335,315 285,350 C 310,330 335,295 355,260 Z" fill="#0f388a" />

  <!-- Hands Cupping Base -->
  <path d="M 105,220 C 110,270 150,340 250,372 C 350,340 390,270 395,220 C 385,260 345,340 250,355 C 155,340 115,260 105,220 Z" fill="#09255e" />

  <!-- The White Heart in the Center -->
  <path d="M 250,362 C 240,355 175,310 175,250 C 175,222 198,202 225,202 C 238,202 246,208 250,214 C 254,208 262,202 275,202 C 302,202 325,222 325,250 C 325,310 260,355 250,362 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Golden Family Inside the White Heart -->
  <g fill="#d89626">
    <!-- Center Mother figure -->
    <circle cx="250" cy="240" r="10" />
    <path d="M 241,254 C 241,250 244,248 250,248 C 256,248 259,250 259,254 L 263,285 C 263,288 260,290 257,290 L 243,290 C 240,290 237,288 237,285 Z" />
    <!-- Child Left -->
    <circle cx="225" cy="254" r="7.5" />
    <path d="M 218,264 C 218,261 220,259 225,259 C 230,259 232,261 232,264 L 235,285 C 235,287 233,289 230,289 L 220,289 C 217,289 215,287 215,285 Z" />
    <!-- Child Right -->
    <circle cx="275" cy="254" r="7.5" />
    <path d="M 268,264 C 268,261 270,259 275,259 C 280,259 282,261 282,264 L 285,285 C 285,287 283,289 280,289 L 270,289 C 267,289 265,287 265,285 Z" />
  </g>

  <!-- Big Bold Acronym "FSEWWI" at Bottom -->
  <text x="250" y="525" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="72" font-weight="900" fill="#0f388a" letter-spacing="4">
    FSEWWI
  </text>
</svg>
